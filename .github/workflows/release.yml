# Builds Windows releases on GitHub's Windows runners (PyInstaller can't cross-compile).
#
#   git tag v1.3.0 && git push origin v1.3.0
#       -> ComicReader-Setup-1.3.0.exe (reader + optional plugin), ComicReader-1.3.0-win64.zip,
#          MangaTranslator-plugin-win64.zip (+ .sha256)
#   git tag translator-v0.2.0 && git push origin translator-v0.2.0
#       -> only MangaTranslator-plugin-win64.zip (+ .sha256): a plugin update
#          that Plugins > Manage in the reader picks up, without a new reader release.
#
# "Run workflow" on the Actions tab does a test build and keeps the files as a workflow artifact.
#
# Code signing (removes the "Windows protected your PC" warning) switches on by itself once these
# repository secrets exist (Settings > Secrets and variables > Actions):
#   SIGN_PFX_BASE64    the code-signing certificate (.pfx), base64-encoded
#   SIGN_PFX_PASSWORD  its password
# Without them the builds are simply unsigned.

name: Release

on:
  push:
    tags: ["v*", "translator-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PLUGIN_ONLY: ${{ startsWith(github.ref_name, 'translator-v') }}
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^(translator-)?v', ''
          if ("${{ github.event_name }}" -ne "push") { $v = "0.0.0-dev" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Install reader requirements
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller

      - name: Build reader
        if: env.PLUGIN_ONLY != 'true'
        run: pyinstaller --noconfirm --clean ComicReader.spec

      - name: Install Manga Translator plugin requirements
        # installed after the reader build so the reader exe doesn't bundle the plugin's packages
        run: pip install -r plugins/manga_translator/requirements.txt

      - name: Add llama.cpp support to the plugin (optional)
        continue-on-error: true   # a prebuilt CPU wheel; if none fits, the plugin ships without it
        run: |
          pip install llama-cpp-python --only-binary=:all: --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Build Manga Translator plugin
        run: pyinstaller --noconfirm --clean plugins/manga_translator/MangaTranslator.spec

      - name: Sign the executables
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          $files = @("dist/manga-translator/manga-translator-worker.exe")
          if (Test-Path dist/ComicReader/ComicReader.exe) { $files += "dist/ComicReader/ComicReader.exe" }
          & $signtool sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/manga-translator/* -DestinationPath release/MangaTranslator-plugin-win64.zip
          $h = (Get-FileHash release/MangaTranslator-plugin-win64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  MangaTranslator-plugin-win64.zip" | Out-File -Encoding ascii release/MangaTranslator-plugin-win64.zip.sha256

      - name: Package reader and build setup.exe
        if: env.PLUGIN_ONLY != 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ComicReader/* -DestinationPath "release/ComicReader-$env:VERSION-win64.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:VERSION" installer/ComicReader.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:SIGN_PFX_BASE64) {
            & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 "dist/ComicReader-Setup-$env:VERSION.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Copy-Item "dist/ComicReader-Setup-$env:VERSION.exe" release/

      - name: Keep the build (manual runs)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: comic-reader-build
          path: release/

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.PLUGIN_ONLY == 'true' && format('Manga Translator plugin {0}', env.VERSION) || format('Comic Reader {0}', env.VERSION) }}
          files: release/*
          generate_release_notes: true
